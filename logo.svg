<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="ARITDER — Arıt Köyü Kültür Turizm ve Kalkınma Derneği logosu">
  <defs>
    <path id="ustYay" d="M 120,120 m -95,0 a 95,95 0 1 1 190,0" fill="none"/>
    <path id="altYay" d="M 120,120 m -98,0 a 98,98 0 0 0 196,0" fill="none"/>
    <clipPath id="icDaire"><circle cx="120" cy="120" r="82"/></clipPath>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef0"/><stop offset="1" stop-color="#cfdcd4"/>
    </linearGradient>
    <linearGradient id="kaya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d6cd"/><stop offset="1" stop-color="#a5a49a"/>
    </linearGradient>
  </defs>

  <!-- yeşil halka -->
  <circle cx="120" cy="120" r="119" fill="#1e9550"/>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#0d5c2f" stroke-width="2"/>
  <circle cx="120" cy="120" r="83.5" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- üst yazı: ARIT KÖYÜ -->
  <text font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800"
        fill="#ffffff" letter-spacing="3" stroke="#0d5c2f" stroke-width=".5">
    <textPath href="#ustYay" startOffset="50%" text-anchor="middle">ARIT KÖYÜ</textPath>
  </text>
  <!-- alt yazı -->
  <text font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700"
        fill="#ffffff" letter-spacing="0.8">
    <textPath href="#altYay" startOffset="50%" text-anchor="middle">KÜLTÜR TURİZM VE KALKINMA DERNEĞİ</textPath>
  </text>

  <!-- orta: kayalık dağ manzarası -->
  <circle cx="120" cy="120" r="82" fill="url(#gok)"/>
  <g clip-path="url(#icDaire)">
    <!-- kayalık sırt -->
    <polygon points="34,118 52,84 68,100 84,72 102,92 118,66 136,90 152,74 168,96 186,82 208,116 208,132 34,132"
             fill="url(#kaya)"/>
    <g fill="#8f8e84" opacity=".8">
      <polygon points="84,72 92,82 84,100 76,90"/>
      <polygon points="118,66 128,80 120,100 110,86"/>
      <polygon points="168,96 176,104 168,118 160,108"/>
    </g>
    <g fill="#efeee8" opacity=".9">
      <polygon points="102,92 110,84 116,96 108,102"/>
      <polygon points="52,84 60,92 54,102 48,94"/>
      <polygon points="152,74 158,84 152,92 146,84"/>
    </g>
    <!-- sonbahar örtüsü -->
    <path d="M34 130 Q60 118 86 128 T140 126 T208 128 L208 150 L34 150 Z" fill="#c46a2b"/>
    <path d="M50 132 q14 -8 30 -2 M120 128 q16 -8 34 -1" stroke="#a04d17" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    <!-- yeşil orman -->
    <path d="M34 148 Q56 136 78 146 T126 145 T176 146 T208 144 L208 210 L34 210 Z" fill="#1c6b38"/>
    <g fill="#134d27">
      <circle cx="60" cy="152" r="9"/><circle cx="84" cy="156" r="11"/><circle cx="152" cy="154" r="10"/><circle cx="182" cy="152" r="8"/>
    </g>
    <!-- vadiye inen yol -->
    <polygon points="112,202 119,148 124,148 134,202" fill="#2e2a24"/>
    <polygon points="116,202 120,160 122,160 128,202" fill="#4a443b" opacity=".7"/>
  </g>
  <!-- kuruluş yılı -->
  <text x="120" y="196" font-family="Manrope,Arial,sans-serif" font-size="13" font-weight="800"
        fill="#ffffff" text-anchor="middle" stroke="#134d27" stroke-width=".6">2018</text>
</svg>
